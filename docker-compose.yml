services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adsdb
      POSTGRES_USER: ads_user
      POSTGRES_PASSWORD: ads_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads_user -d adsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web-service:
    build: ./web-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_NAME: adsdb
      DB_USER: ads_user
      DB_PASSWORD: ads_pass
      WEB_SERVICE_URL: http://web-service:5001
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata: